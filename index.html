
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日待办清单</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #253047;
    }
    h1 { text-align: center; }
    .app {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000010;
    }
    .date { text-align: center; color: #667085; margin-bottom: 20px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #3568e8;
      color: white;
      font-size: 15px;
    }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f5;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { text-decoration: line-through; color: #8992a3; }
    .delete { background: #e5484d; }
    .summary { color: #667085; font-size: 14px; text-align: center; }
    @media (max-width: 480px) {
      body { margin: 12px auto; padding: 10px; }
      .app { padding: 16px; }
      .input-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>📝 每日待办清单</h1>
    <div class="date" id="today"></div>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="请输入今天要做的事">
      <button id="addButton">添加任务</button>
    </div>
    <ul id="taskList"></ul>
    <p class="summary" id="summary">今天还没有任务</p>
  </div>

  <script>
    const today = new Date().toLocaleDateString("sv-SE");
    document.getElementById("today").textContent = "日期：" + today;

    const storageKey = "daily-todo-" + today;
    let tasks = JSON.parse(localStorage.getItem(storageKey) || "[]");

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function renderTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        if (task.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const del = document.createElement("button");
        del.textContent = "删除";
        del.className = "delete";
        del.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, del);
        list.appendChild(item);
      });

      const finished = tasks.filter(task => task.done).length;
      document.getElementById("summary").textContent =
        `共 ${tasks.length} 项任务，已完成 ${finished} 项`;
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      tasks.push({ text, done: false });
      saveTasks();
      renderTasks();
      input.value = "";
      input.focus();
    }

    document.getElementById("addButton").addEventListener("click", addTask);
    document.getElementById("taskInput").addEventListener("keydown", event => {
      if (event.key === "Enter") addTask();
    });

    renderTasks();
  </script>
</body>
</html>
